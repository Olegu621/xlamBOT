<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="xlam-ui-token" content="{{ ui_api_token }}">
    <title>xlamBOT — настройки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/api/assets/support/xlambot_logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/panel.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/studio.css') }}?v={{ asset_version }}">
</head>
<body class="studio-body">
    <header class="studio-header">
        <a class="studio-brand" href="/panel">
            <img class="studio-logo" src="/api/assets/support/xlambot_logo.png" alt="xlamBOT">
            <div>
                <h1 class="studio-title">xlamBOT</h1>
                <p class="studio-subtitle">Настройки, очередь, плейстайлы, история</p>
            </div>
        </a>
        <nav class="studio-tabs" id="tabs">
            <button class="studio-tab is-active" data-tab="dashboard" type="button">Обзор</button>
            <button class="studio-tab" data-tab="brawlers" type="button">Боец</button>
            <button class="studio-tab" data-tab="playstyles" type="button">Плейстайлы</button>
            <button class="studio-tab" data-tab="settings" type="button">Настройки</button>
            <button class="studio-tab" data-tab="history" type="button">История</button>
            <button class="studio-tab" data-tab="logs" type="button">Логи</button>
        </nav>
        <div class="studio-header-right">
            <span id="pollAge" class="poll-age">нет связи</span>
            <a class="btn btn-ghost" href="/panel" title="Панель управления ботом">Панель бота</a>
            <a class="btn btn-ghost channel-link" href="https://t.me/xlamModz" target="_blank" rel="noreferrer" title="Канал с обновлениями">Канал</a>
        </div>
    </header>

    <main class="studio-main">
        <section class="studio-view is-active" id="view-dashboard"></section>
        <section class="studio-view" id="view-brawlers"></section>
        <section class="studio-view" id="view-playstyles"></section>
        <section class="studio-view" id="view-settings"></section>
        <section class="studio-view" id="view-history"></section>
        <section class="studio-view" id="view-logs"></section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="{{ url_for('static', filename='js/ui-session.js') }}?v={{ asset_version }}"></script><script src="{{ url_for('static', filename='js/studio.js') }}?v={{ asset_version }}"></script>
</body>
</html>
