# Как сортировать бойцов. Сортирует сама игра, бот берёт первую карточку:
#   lowest_trophies  - Least Trophies (было единственное)
#   lowest_level    - Power Level (low to high)
#   closest_to_rank - Closest to Next Tier
#   most_trophies   - Most Trophies
#   by_name         - Name
minimum_movement_delay = 0.1
unstuck_movement_delay = 2.4
unstuck_movement_hold_time = 1.4
perceived_tile_size = 54
wall_model_classes = [ "wall", "bush", "close_bush",]
gadget_pixels_minimum = 1300.0
hypercharge_pixels_minimum = 1800.0
super_pixels_minimum = 1800.0
idle_pixels_minimum = 75000.0
centered_wall_detection = false
wall_detection_confidence = 0.6
entity_detection_confidence = 0.55
state_detection_confidence = 0.75
seconds_to_hold_attack_after_reaching_max = 1.5
play_again_on_win = "no"
# Режим, в котором реально играют. Плейстайл пишет в первой строке, для каких
# режимов он сделан, и панель предупредит, если режим не совпадает: раньше
# плейстайл для шоудауна молча водили в ограблении, и бот просто прятался.
game_mode = "trio_showdown"
current_playstyle = "showdown_survivor.xlambot"
# Режим «играть на одном бойце». Пусто - бот работает как раньше, берёт бойца
# по сортировке и переключается. Здесь имя бойца - бот выбирает именно его и
# больше никого, смена бойца и сортировка при этом не применяются.
locked_brawler = ""
# Сколько миллисекунд между кадрами превью устройства в панели. 0 - брать
# каждый запрос. Превью берётся из уже полученного кадра scrcpy и уменьшается
# до ширины карточки, поэтому даже сотня кадров в секунду не мешает игре.
# Раньше превью обновлялось раз в 5 секунд и частоту нельзя было поменять.
preview_interval_ms = 400
gas_model = "models/gasDetector.onnx"
gas_classes = [ "gas", "bush",]
# Обход газа выключен, и это не осторожность, а факт про модель.
# gasDetector обучена на девяти уникальных кадрах, и все девять - это
# Ограбление на Nexus, где газа в игре нет: рамки «газа» в датасете
# в тех же прогонах то 0.003, то 0.62. Порога, который это чинит, нет.
# Разметка битая вдобавок: 8355 из 22848 рамок (36.6%) с координатами вне
# 0..1 - cx 1.95 и 1.98 лежат рядом с нормальными.
# torch и ultralytics поставил, переобучить можно. Не хватает настоящих
# кадров газа из Тройного столкновения.
gas_avoidance = "no"
gas_confidence = 0.25
gas_sensitivity = 0.05
gas_reach = 3.0
gas_lookahead = 4.0
gas_detect_interval = 0.2
gas_escape_cooldown = 0.35
gas_area_top = 0.21
gas_area_bottom = 1.0
brawler_switch_after_games = 7
brawler_rotation = ""
gas_danger_enter = 0.14
gas_danger_exit = 0.05
gas_centre_bias = 0.06
target_trophies = 1000
brawler_pick_mode = "lowest_trophies"
