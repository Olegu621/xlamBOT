name: Distribution CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: Validate signed update and web resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The 341 MB runtime is not needed to validate scripts.zip.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/runtime/
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Test corrupt and unsafe update handling
        run: python -m unittest discover -s tests -v
      - name: Validate the published distribution
        run: python tools/validate_distribution.py
