<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="xlam-ui-token" content="{{ ui_api_token }}">
    <title>xlamBOT — разметка кадров</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/api/assets/support/xlambot_logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/training.css') }}?v={{ asset_version }}">
</head>
<body class="tr-body">
    <header class="tr-header">
        <div class="tr-header-left">
            <img class="tr-logo" src="/api/assets/support/xlambot_logo.png" alt="xlamBOT">
            <div>
                <h1 class="tr-title">Обучение на кадрах</h1>
                <p class="tr-subtitle">Запись <span id="trSession">{{ session_id }}</span> ·
                    кадр <span id="trFrameNo">—</span> из <span id="trFrameTotal">—</span></p>
            </div>
        </div>
        <div class="tr-header-right">
            <div class="tr-progress">
                <div class="tr-progress-bar"><span id="trProgressFill"></span></div>
                <span id="trProgressText" class="tr-progress-text">—</span>
            </div>
            <a class="btn btn-ghost" href="/panel">К ботам</a>
            <button id="trDownload" class="btn btn-primary" type="button" disabled>Скачать .zip</button>
        </div>
    </header>

    <div class="tr-toolbar">
        <span class="tr-tool-label">Рисуем:</span>
        <div id="trClasses" class="tr-classes"></div>
        <span class="tr-sep"></span>
        <button id="trEmpty" class="btn btn-sm" type="button" title="Клавиша N">Здесь ничего нет</button>
        <button id="trUndo" class="btn btn-sm btn-ghost" type="button" title="Ctrl+Z">Отменить</button>
        <button id="trClear" class="btn btn-sm btn-ghost" type="button">Очистить кадр</button>
        <span class="tr-sep"></span>
        <button id="trPrev" class="btn btn-sm" type="button">← Назад</button>
        <button id="trNext" class="btn btn-sm" type="button">Вперёд →</button>
        <span class="tr-hint">
            Тяните мышью, чтобы обвести. <b>1</b> — газ, <b>2</b> — куст,
            <b>Delete</b> — убрать выбранную рамку, <b>N</b> — пустой кадр.
            Кадры без газа отмечайте «Здесь ничего нет»: это тоже ответ, и без них
            модель будет видеть газ везде.
        </span>
    </div>

    <main class="tr-main">
        <aside id="trStrip" class="tr-strip"></aside>
        <div class="tr-stage">
            <canvas id="trCanvas" class="tr-canvas"></canvas>
            <div id="trLoading" class="tr-loading">Загрузка…</div>
        </div>
    </main>

    <div id="trToast" class="tr-toast hidden"></div>
    <script>window.XLAM_SESSION = {{ session_id | tojson }};</script>
    <script src="{{ url_for('static', filename='js/training.js') }}?v={{ asset_version }}"></script>
</body>
</html>
